name: Create Blog Post

on:
  repository_dispatch:
    types: [create-blog-post]

permissions:
  contents: write

concurrency:
  group: blog-post
  cancel-in-progress: false

jobs:
  create-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_GITHUB }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create blog post file
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: node scripts/create-blog-post.cjs

      - name: Commit and push
        env:
          POST_TITLE: ${{ github.event.client_payload.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/
          if git diff --cached --quiet; then
            echo "No new blog post was created."
            exit 1
          else
            git commit -m "Add blog post: ${POST_TITLE} [automated]"
            git pull --rebase origin main
            git push
          fi
